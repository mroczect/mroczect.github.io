name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.19.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zola
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/zola
          key: zola-${{ env.ZOLA_VERSION }}-linux-amd64

      - name: Install Zola
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C ~/.local/bin

      - name: Add Zola to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          time zola build
          echo "---"
          echo "output:"
          find public -type f | wc -l | xargs echo "  files:"
          du -sh public | awk '{print "  size:  " $1}'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
