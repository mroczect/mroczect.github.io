name: Update Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - "content/changelog.tex"

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: true

jobs:
  changelog:
    name: Regenerate LaTeX changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate changelog fragment
        run: python3 scripts/gen_changelog.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet content/changelog.tex; then
            echo "No changelog changes"
            exit 0
          fi

          git add content/changelog.tex
          git commit -m "chore(changelog): auto-update LaTeX fragment [skip ci]"
          git push
