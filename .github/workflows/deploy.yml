name: Build & Deploy Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build from Source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live & GnuPG
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >
            texlive-latex-extra
            texlive-fonts-recommended
            texlive-fonts-extra
            texlive-extra-utils
            texlive-plain-generic
            texlive-pictures
            latexmk
            gnupg
          version: 3.0

      - name: Refresh font maps
        run: sudo updmap-sys

      - name: Import GPG Private Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "❌ Secret GPG_PRIVATE_KEY kosong."
            exit 1
          fi
          echo "Mengimpor GPG Key..."
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "Setting passphrase..."
            echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
            gpg-connect-agent reloadagent /bye
          fi
          echo "--- Secret key tersedia: ---"
          gpg --list-secret-keys --keyid-format=long

      - name: Run Build (make all)
        env:
          GPG_KEY_EMAIL: mroczect@proton.me
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make all

      - name: Clean dist/ directory (remove LaTeX junk)
        run: |
          rm -f dist/main.aux dist/main.log dist/main.fdb_latexmk dist/main.fls \
                dist/main.out dist/main.toc dist/main.xref dist/*.4ct dist/*.4tc \
                dist/*.idv dist/*.lg dist/*.tmp dist/*.dvi
          echo "📂 Isi dist/:"
          ls -R dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 7

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4