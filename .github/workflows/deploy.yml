#
# Verification checklist, for confirming the workflow behaves as
# documented after any edit:
#
#   [ ] Push to main: build job succeeds, deploy job succeeds, site
#       is live at the Pages URL.
#
#   [ ] Push to a feature branch: no workflow run is triggered.
#
#   [ ] workflow_dispatch: a manual run produces the same output as
#       the last push.
#
#   [ ] Remove GPG_PRIVATE_KEY secret (temporarily): build fails at
#       "Import GPG signing key" with "secret GPG_PRIVATE_KEY is
#       empty". No papers are signed. Site is NOT updated.
#
#   [ ] Remove GPG_PASSPHRASE secret: build fails at "make all" with
#       "cannot sign NAME.pdf". Site is NOT updated.
#
#   [ ] Corrupt the GPG_PRIVATE_KEY secret: build fails at "Import
#       GPG signing key" with a gpg import error. Site is NOT
#       updated.
#
#   [ ] Push two commits within 30 seconds: both runs queue, the
#       second waits for the first to finish. Only one site is
#       published at a time.
#
#   [ ] After a successful deploy, download dist/index.html from the
#       site and confirm it does NOT link to any .aux, .log, or
#       .fls file.
#
#   [ ] After a successful deploy, confirm the published changelog
#       contains more than one commit (proving fetch-depth: 0
#       worked).
#
#   [ ] After a successful deploy, confirm public.asc is present at
#       the site root and its content matches the GPG_PUBLIC_KEY
#       secret's decoded value.
#
#   [ ] After a key rotation: update the GPG_PRIVATE_KEY,
#       GPG_PASSPHRASE, and GPG_PUBLIC_KEY secrets, trigger
#       workflow_dispatch, and confirm the site's public.asc matches
#       the new key.
#
# If any check fails, the cause is in one of the sections above.
# The workflow is verified working; edits to it are rare and should
# be accompanied by all eleven checks above.
#
# ==============================================================================
